[project]
name = "resume-assistant"
version = "0.1.0"
description = "Digital Resume Assistant using Open Router API and SendGrid"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.4.0",
    "sendgrid>=6.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = []
